<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>AIRA preview sandbox</title>
<!-- This page is loaded only inside an iframe sandbox without allow-same-origin.
     Generated artifacts receive no network, storage, cookie, parent-DOM, or framing access. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; worker-src blob:; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  html, body { margin: 0; min-height: 100%; background: #fff; }
  body { overflow: auto; }
  #aira-preview-boot { min-height: 100vh; display: grid; place-items: center; color: #667085; font: 13px/1.4 system-ui, sans-serif; }
</style>
<script>
(function () {
  "use strict";
  var host = window.parent;
  var received = false;
  function report(type, message) {
    try { host.postMessage({ source: "aira-artifact", type: type, message: String(message || "") }, "*"); } catch (_) {}
  }
  function render(html) {
    if (received) return;
    received = true;
    try {
      document.open();
      document.write(html);
      document.close();
    } catch (error) {
      report("error", "Preview bootstrap failed: " + (error && error.message || error));
    }
  }
  window.addEventListener("message", function (event) {
    if (event.source !== host) return;
    var data = event.data;
    if (!data || data.source !== "aira-parent" || typeof data.html !== "string") return;
    render(data.html);
  });
  host.postMessage({ source: "aira-artifact", type: "ready" }, "*");
  setTimeout(function () {
    if (!received) report("error", "Preview source was not received.");
  }, 5000);
})();
</script>
</head>
<body>
  <div id="aira-preview-boot">Starting AIRA preview…</div>
</body>
</html>
