name: AIRA integration tests

on:
  push:
    branches: ["main", "feature/afterdark-easter-egg"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run full JavaScript test suite
        run: node --test tests/*.test.js

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find src tests -type f -name '*.js' -print0)

      - name: Check diff whitespace
        run: git diff --check
